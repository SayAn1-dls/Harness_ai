# LCC harness configuration: the single place the evaluation model is defined.
# The API credential is NEVER stored here. It is read at runtime from the
# AI_API_KEY environment variable (export AI_API_KEY="...").
#
# Environment variables override these values without editing this file:
#   LCC_PROVIDER, LCC_MODEL, LCC_BASE_URL, LCC_MODEL_FAST, LCC_MODEL_STRONG

[model]
# The final evaluation uses DeepSeek and Qwen models.
# auto      -> pick the provider from AI_API_KEY: a plain `sk-` key is checked (GET /models, no tokens) against
#              DeepSeek, then Qwen on Alibaba Cloud Model Studio (DashScope, international, then China).
# deepseek | qwen | qwen-cn | gemini | openai | anthropic | openrouter | groq | grok | custom (needs base_url)
provider = "auto"
# Empty = the provider's default below; if the account does not serve it, the preflight call falls back to the
# next model of that provider (deepseek-chat -> deepseek-reasoner; qwen3-coder-plus -> qwen-plus -> qwen-max).
# Set this (or LCC_MODEL) to pin one model, e.g. "deepseek-reasoner" or "qwen3-coder-plus".
model = ""
# Empty = the provider's official OpenAI-compatible endpoint. Any OpenAI-compatible server works here, e.g. a
# self-hosted Qwen on vLLM/Ollama: "http://localhost:8000/v1" (provider becomes "custom").
base_url = ""
# Text-only chat-completions with function calling. No image/audio/video input is ever sent.
temperature = 0.0
# Sent only to providers that accept it; makes runs as repeatable as the provider allows.
seed = 7
max_output_tokens = 4096
# Optional routing: cheap model for intake/review/recovery, strong model for planning/coding on hard tasks.
model_fast = ""
model_strong = ""

# Default model per provider when [model].model is empty.
[model.defaults]
deepseek = "deepseek-chat"
qwen = "qwen3-coder-plus"
qwen-cn = "qwen3-coder-plus"
gemini = "gemini-3.8-flash"
openai = "gpt-4.1"
anthropic = "claude-sonnet-5"
openrouter = "deepseek/deepseek-chat"
groq = "llama-3.3-70b-versatile"
grok = "grok-4"

[run]
# Per issue: coder/recovery iterations and total token budget. Every model call counts its whole prompt, so one
# coder turn late in an attempt costs ~20k tokens: 300k ran out inside the first attempt and recovery never ran.
# 1.5M leaves room for about two full attempts; on deepseek-chat (mostly cache hits) that is well under $1 per issue.
max_iterations = 5
token_budget = 1500000
coder_max_steps = 30
# Where `make run` clones target repositories and writes patches.
workspaces_dir = "workspaces"
outputs_dir = "outputs"
# Create an isolated venv for the target repo and install its dependencies before running tests.
prepare_env = true
# Seconds for one full test-suite run; when it times out, verification uses the tests related to the change.
test_timeout = 900
# One tiny completion before any work: a bad key, empty balance or unknown model is reported in seconds.
preflight = true
# "none": the target's code runs on this machine with credentials stripped from its environment and git guarded.
# "docker": the target's install, tests and shell commands run in a container with no network, no credentials and
# only the workspace mounted. Use it for repositories you do not trust (e.g. `make auto` on a stranger's repo).
# "auto" (default): Docker for auto mode on repositories when Docker is running, "none" otherwise.
sandbox = "auto"

[auto]
# Repo-only mode (`make auto REPO=<url>`, or paste just a repository link into `make run`): the harness finds
# failing tests, static-analysis defects and model-audited bugs/optimizations, fixes the top ones, verifies
# each (a test must fail before and pass after; optimizations must keep every existing test green), and opens
# one pull request per verified fix. It never merges. LCC_OPEN_PR=0 or PR=0 keeps fixes as local branches.
max_fixes = 3
# "full": the model reads the whole repository (most central files first) up to audit_budget_chars characters
# (~4 characters per token). The issue report states how much of the repository was read. "top": audit_calls chunks.
audit_scope = "full"
audit_budget_chars = 120000
audit_calls = 2
audit_chars = 18000
# On a repository you cannot push to, PRs need a confirmation (interactive) or PR=1 (non-interactive).
open_pr = true
pr_draft = true
max_open_prs = 3
# When no fix is proven, open ONE draft PR for the most promising unverified attempt. Its title starts with
# "[unverified]" and its description says what failed. LCC_PR_UNVERIFIED=0 turns it off.
pr_unverified = true
