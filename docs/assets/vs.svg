<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Left: a chatbot says fixed it, then three tests fail. Right: LCC runs the test, sees it fail, fixes the code, sees it pass, checks nothing else broke, and opens a draft PR.">
  <defs>
    <style>
      .serif { font-family: "Tiempos Headline", Georgia, "Times New Roman", serif; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    </style>
  </defs>
  <rect width="900" height="300" rx="22" fill="#F5F1E8"/>
  <rect x="1" y="1" width="898" height="298" rx="21" fill="none" stroke="#E3DED2"/>
  <rect width="0" height="0"><animate id="clk" attributeName="width" values="0;0" dur="12s" begin="0s;clk.end"/></rect>

  <text x="40" y="48" class="serif" font-size="22" fill="#6B6A63">A chatbot</text>
  <rect x="40" y="68" width="360" height="52" rx="16" fill="#FAF9F5" stroke="#E3DED2"/>
  <text x="60" y="100" class="sans" font-size="15" fill="#3D3929">"Fixed it! This should work now 🙂"</text>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="clk.begin+2.5s" dur="9.5s"/>
    <text x="40" y="158" class="m" fill="#8A8778">$ pytest</text>
    <text x="40" y="182" class="m" fill="#B5473A">FAILED tests/test_money.py::test_eur</text>
    <text x="40" y="204" class="m" fill="#B5473A">FAILED tests/test_invoice.py::test_total</text>
    <text x="40" y="226" class="m" fill="#B5473A">3 failed, 41 passed</text>
  </g>
  <text x="40" y="266" class="serif" font-size="17" font-style="italic" fill="#B5473A" opacity="0">…and you find out at 2am.<set attributeName="opacity" to="1" begin="clk.begin+4s" dur="8s"/></text>

  <line x1="450" y1="34" x2="450" y2="266" stroke="#E3DED2" stroke-width="1.5"/>

  <text x="490" y="48" class="serif" font-size="22" fill="#BF5B3A">LCC</text>
  <g class="m">
    <text x="490" y="88" fill="#6B6A63" opacity="0">run the new test<set attributeName="opacity" to="1" begin="clk.begin+1s" dur="11s"/></text>
    <text x="690" y="88" fill="#B5473A" opacity="0">✗ fails · bug confirmed<set attributeName="opacity" to="1" begin="clk.begin+2s" dur="10s"/></text>
    <text x="490" y="120" fill="#6B6A63" opacity="0">edit money.py, invoice.py<set attributeName="opacity" to="1" begin="clk.begin+3.5s" dur="8.5s"/></text>
    <text x="490" y="152" fill="#6B6A63" opacity="0">run the new test<set attributeName="opacity" to="1" begin="clk.begin+5s" dur="7s"/></text>
    <text x="690" y="152" fill="#5E8C61" opacity="0">✓ passes<set attributeName="opacity" to="1" begin="clk.begin+6s" dur="6s"/></text>
    <text x="490" y="184" fill="#6B6A63" opacity="0">run everything else<set attributeName="opacity" to="1" begin="clk.begin+7s" dur="5s"/></text>
    <text x="690" y="184" fill="#5E8C61" opacity="0">✓ nothing broke<set attributeName="opacity" to="1" begin="clk.begin+8s" dur="4s"/></text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="clk.begin+9s" dur="3s"/>
    <rect x="490" y="216" width="370" height="42" rx="21" fill="#D97757"/>
    <text x="675" y="242" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FAF9F5">draft PR opened · a human decides</text>
  </g>
</svg>
