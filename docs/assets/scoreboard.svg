<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348" role="img" aria-label="Scoreboard: 20 of 20 real tasks validated, reference fix 20 of 20, do-nothing model 0 of 20, live model not run yet, 91 tests passing">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lbl { fill: #cbd5e1; font-size: 14px; font-weight: 600; }
      .sub { fill: #64748b; font-size: 11.5px; }
      .num { fill: #f1f5f9; font-size: 15px; font-weight: 800; }
      .track { fill: #1e293b; }
      .q { animation: q 1.4s ease-in-out infinite; }
      @keyframes q { 50% { opacity: .25; } }
    </style>
  </defs>
  <rect width="900" height="348" rx="18" fill="#0b1220"/>
  <text x="32" y="44" class="t" font-size="20" font-weight="800" fill="#f1f5f9">Scoreboard</text>
  <text x="32" y="68" class="t sub">real bug fixes from 6 open-source Python libraries · graded by their own hidden tests</text>

  <g class="t">
    <text x="32" y="110" class="lbl">Benchmark is real</text><text x="32" y="126" class="sub">hidden test fails before the fix, passes after</text>
    <rect x="330" y="98" width="460" height="22" rx="11" class="track"/>
    <rect x="330" y="98" width="0" height="22" rx="11" fill="url(#g)"><animate attributeName="width" from="0" to="460" dur="1.6s" begin="0.2s" fill="freeze"/></rect>
    <text x="810" y="115" class="num">20/20</text>

    <text x="32" y="168" class="lbl">Harness pipeline works</text><text x="32" y="184" class="sub">reference fix replayed through every stage</text>
    <rect x="330" y="156" width="460" height="22" rx="11" class="track"/>
    <rect x="330" y="156" width="0" height="22" rx="11" fill="url(#g)"><animate attributeName="width" from="0" to="460" dur="1.6s" begin="0.8s" fill="freeze"/></rect>
    <text x="810" y="173" class="num">20/20</text>

    <text x="32" y="226" class="lbl">Can't be gamed</text><text x="32" y="242" class="sub">a model that changes nothing</text>
    <rect x="330" y="214" width="460" height="22" rx="11" class="track"/>
    <rect x="330" y="214" width="6" height="22" rx="3" fill="#f87171"/>
    <text x="810" y="231" class="num" fill="#fca5a5">0/20</text>

    <text x="32" y="284" class="lbl">DeepSeek / Qwen live</text><text x="32" y="300" class="sub">the real test of the model</text>
    <rect x="330" y="272" width="460" height="22" rx="11" class="track" stroke="#f59e0b" stroke-dasharray="5 5"/>
    <text x="560" y="288" text-anchor="middle" class="sub" fill="#fbbf24">waiting for an API key · make eval-real</text>
    <text x="810" y="289" class="num q" fill="#fbbf24">?/20</text>
  </g>
  <text x="32" y="334" class="t sub">+ 91 automated tests · macOS + Linux container · CI on Python 3.11 / 3.12 / 3.13</text>
</svg>
