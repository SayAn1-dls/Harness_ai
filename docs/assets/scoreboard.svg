<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Scoreboard: 20 of 20 real tasks validated, reference fix 20 of 20, do-nothing model 0 of 20, live model not run yet, 91 tests passing">
  <defs>
    <style>
      .serif { font-family: "Tiempos Headline", Georgia, "Times New Roman", serif; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lbl { fill: #141413; font-size: 15px; font-weight: 600; }
      .sub { fill: #8A8778; font-size: 12px; }
      .num { font-size: 22px; fill: #141413; }
      .track { fill: #EAE5D9; }
      .q { animation: q 1.4s ease-in-out infinite; }
      @keyframes q { 50% { opacity: .3; } }
    </style>
  </defs>
  <rect width="900" height="350" rx="22" fill="#F5F1E8"/>
  <rect x="1" y="1" width="898" height="348" rx="21" fill="none" stroke="#E3DED2"/>
  <text x="36" y="52" class="serif" font-size="30" fill="#141413">The scoreboard</text>
  <text x="36" y="76" class="sans sub">20 real bugs from 6 open-source Python libraries · graded by the maintainers' own tests</text>

  <g class="sans">
    <text x="36" y="118" class="lbl">The benchmark is real</text><text x="36" y="136" class="sub">each test fails before the real fix, passes after</text>
    <rect x="340" y="108" width="440" height="16" rx="8" class="track"/>
    <rect x="340" y="108" width="0" height="16" rx="8" fill="#D97757"><animate attributeName="width" from="0" to="440" dur="1.6s" begin=".2s" fill="freeze"/></rect>
    <text x="800" y="123" class="serif num">20/20</text>

    <text x="36" y="178" class="lbl">The pipeline works</text><text x="36" y="196" class="sub">the real fix, fed through every stage</text>
    <rect x="340" y="168" width="440" height="16" rx="8" class="track"/>
    <rect x="340" y="168" width="0" height="16" rx="8" fill="#D97757"><animate attributeName="width" from="0" to="440" dur="1.6s" begin=".8s" fill="freeze"/></rect>
    <text x="800" y="183" class="serif num">20/20</text>

    <text x="36" y="238" class="lbl">It can't be cheated</text><text x="36" y="256" class="sub">a model that changes nothing</text>
    <rect x="340" y="228" width="440" height="16" rx="8" class="track"/>
    <rect x="340" y="228" width="6" height="16" rx="3" fill="#B5473A"/>
    <text x="800" y="243" class="serif num" fill="#B5473A">0/20</text>

    <text x="36" y="298" class="lbl">DeepSeek / Qwen, live</text><text x="36" y="316" class="sub">the model's real score</text>
    <rect x="340" y="288" width="440" height="16" rx="8" fill="none" stroke="#C8963E" stroke-dasharray="5 5"/>
    <text x="560" y="301" text-anchor="middle" class="sub" fill="#A87A2E">waiting for a funded API key · make eval-real</text>
    <text x="800" y="303" class="serif num q" fill="#A87A2E">?/20</text>
  </g>
  <text x="36" y="340" class="sans sub" font-size="11">+ 91 automated tests · green on Python 3.11 / 3.12 / 3.13 · also run in a clean Linux container</text>
</svg>
