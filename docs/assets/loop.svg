<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="The recovery loop: implement, verify, diagnose, update context, replan, and exit when verified or when a stop condition is hit">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .box { fill: #111a2e; stroke: #334155; stroke-width: 1.5; }
      .h { fill: #e2e8f0; font-size: 14px; font-weight: 700; }
      .s { fill: #7c8ba1; font-size: 11px; }
      .ring { fill: none; stroke: #1e293b; stroke-width: 3; }
      .spin { fill: none; stroke: #818cf8; stroke-width: 3; stroke-dasharray: 6 12; animation: spin 2s linear infinite; }
      @keyframes spin { to { stroke-dashoffset: -72; } }
      .ok { animation: ok 6s ease-in-out infinite; }
      @keyframes ok { 0%, 70% { opacity: .35; } 78%, 94% { opacity: 1; } 100% { opacity: .35; } }
    </style>
    <path id="orbit" d="M300 60 A 130 110 0 1 1 299.9 60"/>
  </defs>
  <rect width="760" height="330" rx="16" fill="#0b1220"/>

  <use href="#orbit" class="ring"/>
  <use href="#orbit" class="spin"/>
  <circle r="7" fill="#2dd4bf">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
  </circle>

  <g class="t">
    <rect x="236" y="36" width="128" height="48" rx="10" class="box"/>
    <text x="300" y="58" text-anchor="middle" class="h">Implement</text><text x="300" y="74" text-anchor="middle" class="s">coder tool loop</text>

    <rect x="366" y="146" width="128" height="48" rx="10" class="box"/>
    <text x="430" y="168" text-anchor="middle" class="h">Verify</text><text x="430" y="184" text-anchor="middle" class="s">tests · lint · proof</text>

    <rect x="236" y="256" width="128" height="48" rx="10" class="box"/>
    <text x="300" y="278" text-anchor="middle" class="h">Diagnose</text><text x="300" y="294" text-anchor="middle" class="s">failure class</text>

    <rect x="106" y="146" width="128" height="48" rx="10" class="box"/>
    <text x="170" y="168" text-anchor="middle" class="h">Replan</text><text x="170" y="184" text-anchor="middle" class="s">new context + plan</text>
  </g>

  <g class="t">
    <line x1="494" y1="170" x2="560" y2="170" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M560 164 L570 170 L560 176 Z" fill="#2dd4bf"/>
    <g class="ok">
      <rect x="574" y="140" width="160" height="60" rx="12" fill="#0f2a33" stroke="#2dd4bf"/>
      <text x="654" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#5eead4">Verified patch</text>
      <text x="654" y="184" text-anchor="middle" font-size="11" fill="#7dd3c8">committed on agent/*</text>
    </g>
    <text x="574" y="236" font-size="11.5" fill="#f59e0b">Stops early on:</text>
    <text x="574" y="254" font-size="11" fill="#94a3b8">• same failure twice</text>
    <text x="574" y="270" font-size="11" fill="#94a3b8">• iteration / token budget</text>
    <text x="574" y="286" font-size="11" fill="#94a3b8">• falling score · unsafe action</text>
    <text x="24" y="30" font-size="12" fill="#64748b">every attempt carries the previous diff, failure and diagnosis</text>
  </g>
</svg>
