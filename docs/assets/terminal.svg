<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Illustrative terminal session of make auto: scan, candidates, fix, verify, draft pull requests">
  <defs>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="860" height="400" rx="18" fill="#262624"/>
  <rect x="0" y="0" width="860" height="36" rx="18" fill="#30302E"/>
  <rect x="0" y="22" width="860" height="14" fill="#30302E"/>
  <circle cx="24" cy="18" r="6" fill="#D97757"/><circle cx="44" cy="18" r="6" fill="#8A8778"/><circle cx="64" cy="18" r="6" fill="#8A8778"/>
  <text x="430" y="23" text-anchor="middle" class="m" font-size="12" fill="#8A8778">illustrative session · make auto</text>
  <rect width="0" height="0"><animate id="clock" attributeName="width" values="0;0" dur="16s" begin="0s;clock.end"/></rect>
  <g class="m" xml:space="preserve" style="white-space:pre">
    <text x="24" y="68" fill="#F5F1E8"><tspan fill="#D97757">❯</tspan> make auto REPO=https://github.com/acme/demo</text>
    <text x="24" y="94" opacity="0" fill="#C2BFB4">  cloning into workspaces/demo<set attributeName="opacity" to="1" begin="clock.begin+0.6s" dur="15.4s"/></text>
    <text x="24" y="116" opacity="0" fill="#C2BFB4">  running the test suite · static analysis · model audit<set attributeName="opacity" to="1" begin="clock.begin+1.6s" dur="14.4s"/></text>
    <text x="24" y="144" opacity="0" fill="#F5F1E8">  1  audit   mean divides by n-1 (stats.py)<set attributeName="opacity" to="1" begin="clock.begin+3s" dur="13s"/></text>
    <text x="24" y="166" opacity="0" fill="#F5F1E8">  2  static  mutable default argument (calc.py)<set attributeName="opacity" to="1" begin="clock.begin+3.5s" dur="12.5s"/></text>
    <text x="24" y="194" opacity="0" fill="#8A8778">  coder   read_file · find_symbol<set attributeName="opacity" to="1" begin="clock.begin+4.6s" dur="11.4s"/></text>
    <text x="24" y="216" opacity="0" fill="#8A8778">  coder   edit_file · write_file · run_test<set attributeName="opacity" to="1" begin="clock.begin+5.4s" dur="10.6s"/></text>
    <text x="24" y="244" opacity="0" fill="#8FB58F">  ✓ verified   new test fails before, passes after<set attributeName="opacity" to="1" begin="clock.begin+6.4s" dur="9.6s"/></text>
    <text x="24" y="266" opacity="0" fill="#8FB58F">  ✓ review     nothing blocking<set attributeName="opacity" to="1" begin="clock.begin+7.2s" dur="8.8s"/></text>
    <text x="24" y="294" opacity="0" fill="#E8A589">  draft PR  github.com/acme/demo/pull/1<set attributeName="opacity" to="1" begin="clock.begin+8.4s" dur="7.6s"/></text>
    <text x="24" y="316" opacity="0" fill="#E8A589">  draft PR  github.com/acme/demo/pull/2<set attributeName="opacity" to="1" begin="clock.begin+9.6s" dur="6.4s"/></text>
    <text x="24" y="346" opacity="0" fill="#F5F1E8">  2 proven fixes · 2 draft PRs · 0 merges. humans decide.<set attributeName="opacity" to="1" begin="clock.begin+10.8s" dur="5.2s"/></text>
    <text x="24" y="376" opacity="0" fill="#F5F1E8"><tspan fill="#D97757">❯</tspan> <tspan class="cur" fill="#D97757">▍</tspan><set attributeName="opacity" to="1" begin="clock.begin+11.6s" dur="4.4s"/></text>
  </g>
</svg>
