<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="LCC autonomous coding-agent harness: Issue, Context, Plan, Code, Test, Recover, Verify, Pull request">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .node { fill: #111a2e; stroke: #334155; stroke-width: 1.5; }
      .lbl { fill: #cbd5e1; font-size: 13px; font-weight: 600; }
      .sub { fill: #64748b; font-size: 10.5px; }
      .rail { stroke: #1e293b; stroke-width: 3; }
      .flow { stroke: url(#accent); stroke-width: 3; stroke-dasharray: 10 14; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      .pulse { animation: pulse 8s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { stroke: #334155; fill: #111a2e; }
        6%, 12% { stroke: #2dd4bf; fill: #0f2a33; }
        18% { stroke: #334155; fill: #111a2e; }
      }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .fade { animation: fade 8s ease-in-out infinite; }
      @keyframes fade { 0%, 80% { opacity: 0; } 86%, 96% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="960" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="298" rx="17" fill="none" stroke="#1f2a44"/>

  <text x="48" y="64" class="t" font-size="30" font-weight="800" fill="#f1f5f9">LCC <tspan fill="url(#accent)">AI Harness</tspan></text>
  <text x="48" y="92" class="t" font-size="15" fill="#94a3b8">Turns a GitHub issue (or just a repo link) into a verified, reviewable pull request.</text>
  <text x="48" y="116" class="m" font-size="12.5" fill="#64748b">$ make run<tspan class="blink" fill="#2dd4bf"> ▍</tspan></text>

  <line x1="84" y1="200" x2="876" y2="200" class="rail"/>
  <line x1="84" y1="200" x2="876" y2="200" class="flow"/>

  <g class="t">
    <g><rect x="40" y="172" width="88" height="56" rx="12" class="node pulse" style="animation-delay:0s"/>
      <text x="84" y="197" text-anchor="middle" class="lbl">Issue</text><text x="84" y="213" text-anchor="middle" class="sub">URL · text · repo</text></g>
    <g><rect x="146" y="172" width="88" height="56" rx="12" class="node pulse" style="animation-delay:.8s"/>
      <text x="190" y="197" text-anchor="middle" class="lbl">Context</text><text x="190" y="213" text-anchor="middle" class="sub">rank · snapshot</text></g>
    <g><rect x="252" y="172" width="88" height="56" rx="12" class="node pulse" style="animation-delay:1.6s"/>
      <text x="296" y="197" text-anchor="middle" class="lbl">Plan</text><text x="296" y="213" text-anchor="middle" class="sub">files · steps</text></g>
    <g><rect x="358" y="172" width="88" height="56" rx="12" class="node pulse" style="animation-delay:2.4s"/>
      <text x="402" y="197" text-anchor="middle" class="lbl">Code</text><text x="402" y="213" text-anchor="middle" class="sub">tool loop</text></g>
    <g><rect x="464" y="172" width="88" height="56" rx="12" class="node pulse" style="animation-delay:3.2s"/>
      <text x="508" y="197" text-anchor="middle" class="lbl">Test</text><text x="508" y="213" text-anchor="middle" class="sub">vs baseline</text></g>
    <g><rect x="570" y="172" width="88" height="56" rx="12" class="node pulse" style="animation-delay:4s"/>
      <text x="614" y="197" text-anchor="middle" class="lbl">Recover</text><text x="614" y="213" text-anchor="middle" class="sub">diagnose · retry</text></g>
    <g><rect x="676" y="172" width="88" height="56" rx="12" class="node pulse" style="animation-delay:4.8s"/>
      <text x="720" y="197" text-anchor="middle" class="lbl">Verify</text><text x="720" y="213" text-anchor="middle" class="sub">fail → pass</text></g>
    <g><rect x="782" y="172" width="138" height="56" rx="12" class="node pulse" style="animation-delay:5.6s"/>
      <text x="851" y="197" text-anchor="middle" class="lbl">Pull request</text><text x="851" y="213" text-anchor="middle" class="sub">human merges</text></g>
  </g>

  <path d="M614 172 C 614 140, 402 140, 402 172" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 5" opacity=".75"/>
  <text x="508" y="146" text-anchor="middle" class="t" font-size="10.5" fill="#f59e0b">retry with the failure as context</text>

  <g class="fade t">
    <rect x="712" y="244" width="208" height="30" rx="15" fill="#0f2a33" stroke="#2dd4bf"/>
    <text x="816" y="264" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5eead4">✓ VERIFIED · never auto-merged</text>
  </g>
  <text x="48" y="266" class="t" font-size="12" fill="#475569">DeepSeek · Qwen · any OpenAI-compatible model</text>
</svg>
