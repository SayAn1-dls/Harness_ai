<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="LCC: fixes that come with proof. Issue, context, plan, code, test, recover, verify, pull request.">
  <defs>
    <style>
      .serif { font-family: "Tiempos Headline", Georgia, "Times New Roman", serif; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip { fill: #FAF9F5; stroke: #E3DED2; stroke-width: 1.2; }
      .lbl { fill: #3D3929; font-size: 13px; font-weight: 600; }
      .ring { fill: none; stroke: #D97757; transform-origin: 830px 104px; animation: ring 3.6s ease-out infinite; }
      @keyframes ring { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
      .glow { animation: glow 8s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { fill: #FAF9F5; stroke: #E3DED2; } 7%, 13% { fill: #F6E3D9; stroke: #D97757; } 20% { fill: #FAF9F5; stroke: #E3DED2; } }
      .caret { animation: caret 1s steps(1) infinite; }
      @keyframes caret { 50% { opacity: 0; } }
    </style>
    <clipPath id="type"><rect x="56" y="150" width="0" height="34">
      <animate attributeName="width" values="0;620;620;0" keyTimes="0;.45;.9;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <path id="rail" d="M100 272 H 860"/>
  </defs>

  <rect width="960" height="360" rx="22" fill="#F5F1E8"/>
  <rect x="1" y="1" width="958" height="358" rx="21" fill="none" stroke="#E3DED2"/>

  <!-- pulse motif -->
  <circle cx="830" cy="104" r="40" class="ring"/>
  <circle cx="830" cy="104" r="40" class="ring" style="animation-delay:1.2s"/>
  <circle cx="830" cy="104" r="40" class="ring" style="animation-delay:2.4s"/>
  <circle cx="830" cy="104" r="15" fill="#D97757"/>
  <text x="830" y="109" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#FAF9F5">✓</text>

  <text x="56" y="96" class="serif" font-size="56" fill="#141413">LCC</text>
  <text x="178" y="96" class="serif" font-size="26" font-style="italic" fill="#BF5B3A">an AI harness</text>
  <g clip-path="url(#type)">
    <text x="56" y="176" class="serif" font-size="27" fill="#3D3929">Fixes that come with proof, or not at all.</text>
  </g>
  <rect x="56" y="152" width="2" height="30" fill="#D97757" class="caret">
    <animate attributeName="x" values="56;676;676;56" keyTimes="0;.45;.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="56" y="212" class="sans" font-size="14" fill="#6B6A63">Give it a bug, or just a repo link. It fixes, tests and verifies, and a human decides what merges.</text>

  <line x1="100" y1="272" x2="860" y2="272" stroke="#E3DED2" stroke-width="2"/>
  <circle r="6" fill="#D97757"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>

  <g class="sans" text-anchor="middle">
    <rect x="56" y="252" width="88" height="40" rx="20" class="chip glow" style="animation-delay:0s"/><text x="100" y="277" class="lbl">Issue</text>
    <rect x="164" y="252" width="88" height="40" rx="20" class="chip glow" style="animation-delay:1s"/><text x="208" y="277" class="lbl">Context</text>
    <rect x="272" y="252" width="88" height="40" rx="20" class="chip glow" style="animation-delay:2s"/><text x="316" y="277" class="lbl">Plan</text>
    <rect x="380" y="252" width="88" height="40" rx="20" class="chip glow" style="animation-delay:3s"/><text x="424" y="277" class="lbl">Code</text>
    <rect x="488" y="252" width="88" height="40" rx="20" class="chip glow" style="animation-delay:4s"/><text x="532" y="277" class="lbl">Test</text>
    <rect x="596" y="252" width="88" height="40" rx="20" class="chip glow" style="animation-delay:5s"/><text x="640" y="277" class="lbl">Recover</text>
    <rect x="704" y="252" width="88" height="40" rx="20" class="chip glow" style="animation-delay:6s"/><text x="748" y="277" class="lbl">Verify</text>
    <rect x="812" y="252" width="100" height="40" rx="20" fill="#D97757"/><text x="862" y="277" class="lbl" fill="#FAF9F5">Draft PR</text>
  </g>
  <text x="56" y="332" class="sans" font-size="12" fill="#8A8778">DeepSeek · Qwen · any OpenAI-compatible model · never auto-merges</text>
</svg>
