<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Project journey: core loop, proof, make run, DeepSeek and Qwen, auto mode, QA pass, real benchmark, sandbox">
  <defs>
    <style>
      .serif { font-family: "Tiempos Headline", Georgia, "Times New Roman", serif; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h { fill: #141413; font-size: 14px; }
      .s { fill: #8A8778; font-size: 10.5px; }
      .dot { fill: #FAF9F5; stroke: #D8D2C4; stroke-width: 2; animation: on 9s ease-in-out infinite; }
      @keyframes on { 0%, 100% { fill: #FAF9F5; stroke: #D8D2C4; } 8%, 88% { fill: #D97757; stroke: #BF5B3A; } }
      .bar { stroke: #D97757; stroke-width: 3; stroke-dasharray: 860; stroke-dashoffset: 860; animation: draw 9s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 860; } 70%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 860; } }
    </style>
  </defs>
  <rect width="960" height="260" rx="22" fill="#F5F1E8"/>
  <rect x="1" y="1" width="958" height="258" rx="21" fill="none" stroke="#E3DED2"/>
  <text x="36" y="50" class="serif" font-size="28" fill="#141413">How we got here</text>
  <line x1="60" y1="130" x2="920" y2="130" stroke="#E3DED2" stroke-width="3"/>
  <line x1="60" y1="130" x2="920" y2="130" class="bar"/>
  <g text-anchor="middle">
    <circle cx="60" cy="130" r="10" class="dot" style="animation-delay:0s"/>
    <text x="72" y="102" class="serif h">Core loop</text><text x="72" y="160" class="sans s">tools + recovery</text>
    <circle cx="183" cy="130" r="10" class="dot" style="animation-delay:.6s"/>
    <text x="183" y="102" class="serif h">Proof</text><text x="183" y="160" class="sans s">fail → pass or nothing</text>
    <circle cx="306" cy="130" r="10" class="dot" style="animation-delay:1.2s"/>
    <text x="306" y="102" class="serif h">make run</text><text x="306" y="160" class="sans s">hackathon interface</text>
    <circle cx="429" cy="130" r="10" class="dot" style="animation-delay:1.8s"/>
    <text x="429" y="102" class="serif h">DeepSeek · Qwen</text><text x="429" y="160" class="sans s">+ any local LLM</text>
    <circle cx="552" cy="130" r="10" class="dot" style="animation-delay:2.4s"/>
    <text x="552" y="102" class="serif h">Auto mode</text><text x="552" y="160" class="sans s">repo link → draft PRs</text>
    <circle cx="675" cy="130" r="10" class="dot" style="animation-delay:3s"/>
    <text x="675" y="102" class="serif h">QA pass</text><text x="675" y="160" class="sans s">12 bugs, 12 tests</text>
    <circle cx="798" cy="130" r="10" class="dot" style="animation-delay:3.6s"/>
    <text x="798" y="102" class="serif h">Real bugs</text><text x="798" y="160" class="sans s">20 validated</text>
    <circle cx="920" cy="130" r="10" class="dot" style="animation-delay:4.2s"/>
    <text x="900" y="102" class="serif h">Sandbox</text><text x="900" y="160" class="sans s">no keys, no net</text>
  </g>
  <text x="36" y="226" class="serif" font-size="15" font-style="italic" fill="#BF5B3A">next stop: a live DeepSeek / Qwen score</text>
</svg>
