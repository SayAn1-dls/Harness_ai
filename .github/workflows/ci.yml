name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: make test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: make setup
        run: make setup PYTHON=python
      - name: make lint
        run: make lint
      - name: make test (unit tests + offline benchmark, no API key)
        run: make test

  real-benchmark:
    name: real benchmark integrity (20 real bug fixes)
    runs-on: ubuntu-latest
    timeout-minutes: 45  # ~16 min on GitHub runners: 20 real test suites, three passes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup PYTHON=python
      - name: hidden tests fail before / pass after; oracle 20/20; do-nothing 0/20
        run: make bench-check
